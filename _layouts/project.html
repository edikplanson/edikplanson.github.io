---
layout: default
---

<article class="project">

    <h1>{{ page.title }}</h1>

    {% if page.image %}
        <img
            class="project-cover"
            src="{{ page.image }}"
            alt="{{ page.title }}"
        >
    {% endif %}

    <div class="project-content">
        {{ content }}
    </div>

</article>
